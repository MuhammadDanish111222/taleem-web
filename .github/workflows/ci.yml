name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-unit-tests:
    name: web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  firestore-integration-tests:
    name: Firestore emulator integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  production-build:
    name: production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyMockApiKeyForProductionBuildCI12345"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mock-project.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mock-project-id"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mock-project.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789:web:abcdef"
      ADMIN_PANEL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  cross-repository-http-integration-test:
    name: cross-repository HTTP integration test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout taleem-web
        uses: actions/checkout@v4
        with:
          path: taleem-web

      - name: Checkout taleem-ai-service
        uses: actions/checkout@v4
        with:
          repository: MuhammadDanish111222/taleem-ai-service
          path: taleem-ai-service
          ref: module-3/internal-auth-and-worker-runtime

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: taleem-web/package-lock.json

      - name: Install uv (Python package runner)
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies for taleem-ai-service
        working-directory: taleem-ai-service
        run: uv sync

      - name: Install Node dependencies for taleem-web
        working-directory: taleem-web
        run: npm ci

      - name: Run cross-repository HTTP integration test
        working-directory: taleem-web
        run: npm run test:bff:http
